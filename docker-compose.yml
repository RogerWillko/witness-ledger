# One-way pipe: two containers, no shared volume.
# The model can POST /log. The witness never serves chain data.
services:
  witness:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./witness.py:/app/witness.py:ro
      - witness-data:/data
    environment:
      WITNESS_DB: /data/chain.db
    command: ["sh", "-c", "pip install -q fastapi uvicorn && python witness.py serve"]
    ports:
      - "8000:8000"
    restart: unless-stopped

  model:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./model_side.py:/app/model_side.py:ro
    environment:
      WITNESS_URL: http://witness:8000
    command: ["python", "model_side.py", "demo"]
    depends_on:
      - witness
    restart: "no"

volumes:
  witness-data:
