# Three machines, no shared volumes: witness, judge, store.
# Wrapper talks to all three. The model can only POST /log.
#
# This judge container is portable: token overlap + judge/post_score.py.
# It is not QLoRA and does not claim the V2 0.99/0-FA holdout numbers.
# Apple Silicon QLoRA (V2 production adapters): docker-compose.mlx.yml.
services:
  witness:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./witness.py:/app/witness.py:ro
      - ./supervisor.py:/app/supervisor.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./protocols:/app/protocols:ro
      - witness-data:/data
    environment:
      WITNESS_DB: /data/chain.db
      WITNESS_HOST: 0.0.0.0
      PROTOCOL_FILE: /app/protocols/community_care.json
      RUN_PATH: /data/run/weights.bin
      RECEIPT_PATH: /data/run/receipt.json
      STORE_PATH: /data/store/weights.bin
      STORE_URL: http://store:8091
      STORE_KEY: dev-store-key-not-a-secret
      WITNESS_HMAC_FILE: /data/hmac.key
      WITNESS_HMAC_KEY: dev-hmac-not-a-secret
      WITNESS_LOG_KEY: dev-log-key-not-a-secret
      WITNESS_GENESIS_KEY: dev-genesis-not-a-secret
      WITNESS_PUSH_ALLOW: model,127.0.0.1,localhost
      JUDGE_URL: http://judge:8090
      JUDGE_KEY: dev-judge-key-not-a-secret
      REENTRY_SCORE_MIN: "0.55"
    command: ["sh", "-c", "pip install -q -r requirements.txt && python witness.py serve"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 25s
    depends_on:
      judge:
        condition: service_healthy
    restart: unless-stopped

  store:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./store.py:/app/store.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - store-data:/data
    environment:
      STORE_PATH: /data/weights.bin
      STORE_HOST: 0.0.0.0
      STORE_PORT: "8091"
      STORE_KEY: dev-store-key-not-a-secret
    command: ["sh", "-c", "pip install -q -r requirements.txt && python store.py"]
    restart: unless-stopped

  judge:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./judge.py:/app/judge.py:ro
      - ./judge/post_score.py:/app/judge/post_score.py:ro
      - ./data/judge.jsonl:/app/data/judge.jsonl:ro
      - ./requirements.txt:/app/requirements.txt:ro
    environment:
      JUDGE_HOST: 0.0.0.0
      JUDGE_PORT: "8090"
      JUDGE_DATA: /app/data/judge.jsonl
      JUDGE_KEY: dev-judge-key-not-a-secret
    command: ["sh", "-c", "pip install -q -r requirements.txt && python judge.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 25s
    restart: unless-stopped

  wrapper:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./wrapper.py:/app/wrapper.py:ro
      - ./supervisor.py:/app/supervisor.py:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./protocols:/app/protocols:ro
      - ./data/care.jsonl:/app/data/care.jsonl:ro
    environment:
      CARE_FILE: /app/data/care.jsonl
      PROTOCOL_FILE: /app/protocols/community_care.json
      WRAPPER_HOST: 0.0.0.0
      WRAPPER_PORT: "8080"
      JUDGE_URL: http://judge:8090
      JUDGE_KEY: dev-judge-key-not-a-secret
      WITNESS_URL: http://witness:8000
      WITNESS_HMAC_KEY: dev-hmac-not-a-secret
      STORE_URL: http://store:8091
      STORE_KEY: dev-store-key-not-a-secret
    command: ["sh", "-c", "pip install -q -r requirements.txt && python wrapper.py serve"]
    ports:
      - "8080:8080"
    depends_on:
      witness:
        condition: service_healthy
      judge:
        condition: service_healthy
      store:
        condition: service_started
    restart: unless-stopped

  model:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./model_side.py:/app/model_side.py:ro
      - ./protocols/PIN:/app/protocols/PIN:ro
    environment:
      WITNESS_URL: http://witness:8000
      PROTOCOL_PIN_FILE: /app/protocols/PIN
      WITNESS_LOG_KEY: dev-log-key-not-a-secret
      MODEL_KEY: dev-genesis-not-a-secret
    command: ["python", "model_side.py", "demo"]
    depends_on:
      witness:
        condition: service_healthy
    restart: "no"

volumes:
  witness-data:
  store-data:
