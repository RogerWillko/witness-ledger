# Overlay: wrapper talks to a host QLoRA judge (V2 production or v7.3 optional),
# not the lexical container. Same post_score.py. Linux images cannot run MLX.
#
#   python judge/serve.py -- not used; set JUDGE_ADAPTER_PATH then:
#   python judge/serve.py
#   docker compose -f docker-compose.yml -f docker-compose.mlx.yml up
#
# Host judge must bind 0.0.0.0:8090 (JUDGE_HOST=0.0.0.0).

services:
  wrapper:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JUDGE_URL: http://host.docker.internal:8090
